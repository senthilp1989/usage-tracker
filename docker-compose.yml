services:
  database:
    image: postgres:15
    container_name: usage-tracker-db
    restart: always
    environment:
      POSTGRES_USER: usage_tracker
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: usage_tracker
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [usage-tracker-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usage_tracker -d usage_tracker"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: usage-tracker-api
    restart: always
    ports:
      - "${API_PUBLISH_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://usage_tracker:${DB_PASSWORD:-changeme}@database:5432/usage_tracker
      API_KEY: ${API_KEY:?API_KEY must be set in .env}
      DASHBOARD_USERNAME: ${DASHBOARD_USERNAME:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:?DASHBOARD_PASSWORD must be set in .env}
    depends_on:
      database:
        condition: service_healthy
    networks: [usage-tracker-network]

  frontend:
    build: ./frontend
    container_name: usage-tracker-frontend
    restart: always
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3005}:80"
    depends_on:
      - api
    networks: [usage-tracker-network]

networks:
  usage-tracker-network:
    driver: bridge
